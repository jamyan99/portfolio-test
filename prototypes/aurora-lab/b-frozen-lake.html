<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frozen Lake · Aurora lab</title>
<link rel="icon" href="../../favicon.ico" sizes="16x16 32x32 48x48">

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<style>
  /* Projects under the ice are real links too, for keyboard and screen readers. */
  .under a {
    position: fixed; z-index: 11; border-radius: 18px; outline: none; color: transparent; font-size: 0;
    pointer-events: none;
  }
  .under a:focus-visible { box-shadow: 0 0 0 2px #F3F2EE; }
  .under a span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  /* The headline text is drawn into the lake scene (frosted, melting under the flame); the real
     text stays in the page, invisible, for layout, selection and screen readers. */
  .frost-text { color: transparent !important; }
  /* The scene draws its own shade behind the copy, so the drawn text isn't dimmed by it. */
  .stage::after { display: none; }
  /* The flame is the cursor across the whole hero. */
  @media (pointer: fine) { .aurora-hero, .aurora-hero *, .stage canvas { cursor: none !important; } }
  /* Lab bar: a switch for how the body text frosts (for comparing; not part of the concept). */
  .labbar .opts { display: inline-flex; align-items: center; gap: 2px; padding: 0 2px 0 10px; opacity: 1; overflow: visible; }
  .labbar .opts button {
    all: unset; cursor: pointer; padding: 7px 10px; border-radius: 999px; color: #fff; opacity: .65;
    font: inherit;
  }
  .labbar .opts button:hover { opacity: 1; }
  .labbar .opts button[aria-pressed="true"] { opacity: 1; background: rgba(255, 255, 255, .16); }
  .labbar .opts button:focus-visible { box-shadow: 0 0 0 2px #FFB38F; }
  /* One screen: nothing below the lake, and no scrolling (or overscroll bounce). */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  /* The flame sits above the real body copy as well as the textured name. */
  .flame-overlay { position: fixed; inset: 0; z-index: 14; pointer-events: none; }
  .tag { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(8, 12, 22, .9); }
  @media (max-width: 760px) {
    .labbar { flex-wrap: wrap; justify-content: center; width: max-content; border-radius: 20px; }
    .labbar .hint { display: none; }
    .labbar .opts { flex-basis: 100%; justify-content: center; padding: 0; }
  }
  /* First paint: the lake and its copy arrive together, once the ice and what's under it have
     loaded, instead of popping in piece by piece. */
  .lake-loading :is(.stage, .hero-copy, .lake-about, .labbar, .flame-overlay) { opacity: 0; }
  .hero-copy, .labbar { transition: opacity var(--mo-slow) var(--mo-ease); }
  /* For people trying the page: a one-line hint, no lab tools, no TODO headline. */
  .no-lab .labbar > :not(.hint) { display: none; }
  .no-lab .labbar .hint { display: block; white-space: normal; text-align: center; }
  .no-lab .hero-copy .todo { display: none; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<p class="fallback">This concept needs WebGL.</p>
<script type="module">
import {
  THREE, AURORA_GLSL, auroraUniforms, auroraController, mountPage, makeTag,
  WORK, PLAYGROUND, IMG, workHref, reducedMotion, damp,
} from './aurora.js';
import { mountLakeRooms } from './b-rooms.js';
import { paintCrawler } from '../crawler/crawler.js';

// Seen from straight above: a frozen lake at night. The cursor is a warm hand that melts the
// ice; the dark water underneath mirrors the aurora overhead, and the projects frozen under
// the ice come through sharp where it has melted. The ice slowly freezes over again.
//
// Each frame runs three light passes instead of one heavy one:
//   1. melt: a small simulation on the GPU; the cursor's path since the last frame melts at
//      once, and everything slowly refreezes from the edges in;
//   2. aurora: the reflection overhead, at half resolution (it's soft anyway);
//   3. composite: the lake as you see it, using the ice drawn once (below) and drawing the
//      water and the projects only where the ice is open.
// The ice itself (clear, with snow at the shore and the projects blurred under it) is drawn
// once at full sharpness whenever the window changes size.
const { hero, copy } = mountPage('Melt the ice or the name · double-click to flare · click a project');
document.querySelector('.aurora-after').remove(); // (one screen: nothing to scroll down to)
// The lab tools are J's: they show locally (or with ?lab). People trying the page get a one-line
// hint, and the headline's TODO box stays out of the way until J writes it. (?public previews
// that locally.)
const query = new URLSearchParams(location.search);
const lab = query.has('lab') || (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !query.has('public'));
if (!lab) {
  document.documentElement.classList.add('no-lab');
  document.title = 'Jamiyan Batnyam — UX / Product Designer, SCAD 2027';
  if (matchMedia('(pointer: coarse)').matches) document.querySelector('.labbar .hint').textContent = 'Tap to melt · tap again to open · double-tap to flare';
}
// The case studies are right here, on the east shore.
copy.querySelector('.actions .pill').href = '#/work/liminal';
const stageEl = document.getElementById('stage');
const tag = makeTag();
const now = () => performance.now();

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (err) {
  document.documentElement.classList.add('no-webgl');
  throw err;
}
// Keep baked ice and text sharp even when the animated output changes resolution.
const detailScale = Math.min(devicePixelRatio, 2);
// Profiling at 1440×900: the composite dominates GPU time. 1.5× output removes
// 44% of its DPR-2 fragments while the static ice/text sources retain 2× detail.
let scale = Math.min(detailScale, 1.5);
renderer.setPixelRatio(scale);
// First paint: hold everything back until the textures are in (1.5 s at most), then let it all
// fade in together (see .lake-loading).
document.documentElement.classList.add('lake-loading');
{
  let shown = false;
  const arrive = () => {
    if (shown) return;
    shown = true;
    needsBake = true; invalidate();
    requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('lake-loading')));
  };
  THREE.DefaultLoadingManager.onLoad = arrive;
  setTimeout(arrive, 1500);
}
stageEl.append(renderer.domElement);

// ---------- What's under the ice ----------
const loader = new THREE.TextureLoader();
const byId = Object.fromEntries(WORK.map((w) => [w.id, w]));
// What stands for each project under the ice. The motorcycle dashboard is its own round display;
// FINRA shows only its public summary image. Liminal and ContentPlus are their own cut-out artwork
// (the lab bar's Objects switch compares them with the phone screens they started as): Liminal's
// onboarding doorway, a figure walking into the light (the name means an in-between space), and
// Koko, asleep in the ice until you melt him awake. Both come full size from J's Figma files
// (art/: the doorway's flat background cut away, Koko as drawn), not the small web versions.
const ART = {
  doorway: { src: 'art/liminal-doorway.png', aspect: 1086 / 1448 },
  koko: { src: 'art/koko-sleep.png', aspect: 1 },
  kokoAwake: { src: 'art/koko-wave.png', aspect: 1 },
};
const artTex = Object.fromEntries(Object.entries(ART).map(([k, a]) => [k, loader.load(a.src, () => { needsBake = true; invalidate(); })]));
const CARDS = [
  { ...byId.liminal, src: 'liminal/screens/meditation-player.jpg', shape: 0 },
  { ...byId['content-plus'], src: 'content-plus/screens/videos-home.jpg', shape: 0 },
  { ...byId.hmi, src: 'vibe-coding/screens/settings.png', shape: 1 },
  { ...byId.finra, src: 'framer/j90JLu2USyq46GRLYCzX1TgsCc-1024.webp', shape: 2 },
  // The basketball: melt it free and the view pans down to the playground, the 3D studio, in the
  // south room (it used to leave for the Playground page).
  { ...PLAYGROUND, room: '#/playground', glow: '#FF8A4C', shape: 3 },
  // A crawler frozen mid-stride (prototypes/crawler): melt it free and it opens the same room at
  // the notes it climbs out onto.
  { title: 'Crawler', room: '#/playground/crawler', glow: '#9EF0D6', shape: 4, sprite: true, aspect: 2, flag: 2 },
  // SoundCloud: the redesigned player we tested, on a phone (the case study's own screen); melt it
  // free and it opens its room on the east shore.
  { id: 'soundcloud', title: 'SoundCloud', sub: 'UX research case study', src: 'soundcloud/screens/player.jpg', shape: 0, aspect: 804 / 1740, glow: '#FF5500' },
].map((c) => ({
  ...c,
  heat: 0,
  tex: c.src ? loader.load(IMG + c.src, () => { needsBake = true; invalidate(); }) : c.sprite ? crawlerTexture() : null,
  glowColor: new THREE.Color(c.glow),
}));
CARDS.forEach((c) => { c.screen = { tex: c.tex, shape: c.shape, aspect: c.aspect }; });

function crawlerTexture() {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 256;
  paintCrawler(cv.getContext('2d'), 512, 256);
  return new THREE.CanvasTexture(cv);
}

// ---------- Shared uniforms and GLSL ----------
const u = {
  ...auroraUniforms(),
  uRes: { value: new THREE.Vector2(1, 1) },   // size of the target being drawn
  uView: { value: new THREE.Vector2(1, 1) },  // CSS size of the screen
  uCard0: { value: CARDS[0].tex },
  uCard1: { value: CARDS[1].tex },
  uCard2: { value: CARDS[2].tex },
  uCard3: { value: CARDS[3].tex },
  uCard4: { value: CARDS[5].tex },
  uCard5: { value: artTex.kokoAwake },
  uCard6: { value: CARDS[6].tex },
  uRect: { value: CARDS.map(() => new THREE.Vector4()) },
  uMeta: { value: CARDS.map(() => new THREE.Vector4()) },
  uGlow: { value: CARDS.map((c) => c.glowColor) },
  uLake: { value: new THREE.Vector4(0, 0, 1, 1) },
};

const COMMON = /* glsl */ `
  uniform vec2 uRes;
  uniform vec2 uView;
  uniform sampler2D uCard0, uCard1, uCard2, uCard3, uCard4, uCard5, uCard6;
  uniform vec4 uRect[7];  // centre xy, half size zw (screen units: height = 1)
  uniform vec4 uMeta[7];  // angle, shape (0 phone, 1 round, 2 wide screen, 3 ball, 4 cut-out), heat, flag (1 wakes, 2 thin)
  uniform vec3 uGlow[7];
  uniform vec4 uLake;     // centre xy, half size zw of the lake
  ${AURORA_GLSL}

  // Screen units: height = 1, centre = 0, y up.
  vec2 screenP() { return (gl_FragCoord.xy / uRes - .5) * vec2(uView.x / uView.y, 1.); }
  mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
  float sdBox(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
  float fbm5(vec2 p) {
    float v = 0., a = .5;
    for (int i = 0; i < 5; i++) { v += a * vnoise(p); p = p * 2.02 + vec2(3.1, 1.7); a *= .5; }
    return v;
  }
  float lakeDist(vec2 p) { return sdBox(p - uLake.xy, uLake.zw, .14) + (fbm3(p * 4.) - .5) * .07 + (fbm5(p * 22.) - .5) * .012; }

  vec3 sampleCard(int i, vec2 uv, float bias) {
    vec3 c = texture2D(uCard3, uv, bias).rgb;
    if (i == 0) c = texture2D(uCard0, uv, bias).rgb;
    else if (i == 1) c = texture2D(uCard1, uv, bias).rgb;
    else if (i == 2) c = texture2D(uCard2, uv, bias).rgb;
    else if (i == 6) c = texture2D(uCard6, uv, bias).rgb;
    return c;
  }
  // A cut-out's own colour and alpha. Koko (flag 1) wakes as he's melted: his sleeping pose gives
  // way to a wave once the water over him is open.
  vec4 sampleSprite(int i, vec2 uv, float bias) {
    vec4 t = texture2D(uCard4, uv, bias);
    if (i == 0) t = texture2D(uCard0, uv, bias);
    else if (i == 1) t = mix(texture2D(uCard1, uv, bias), texture2D(uCard5, uv, bias), smoothstep(.45, .75, uMeta[i].z) * step(.5, uMeta[i].w) * step(uMeta[i].w, 1.5));
    return t;
  }
  // One thing under the ice: colour and coverage, plus its outline distance.
  vec4 card(int i, vec2 p, float bias, out float edge) {
    vec4 r = uRect[i];
    vec2 d = rot(-uMeta[i].x) * (p - r.xy);
    float shape = uMeta[i].y;
    float aa = 1.2 / uView.y;
    vec3 col = vec3(0.);
    float alpha = -1.;  // (the crawler's sprite brings its own coverage)
    if (shape > 3.5) {
      // A cut-out (the crawler, the orb or mandala, Koko): see-through around it, its outline
      // distance taken from its own edge (alpha 0.5) so the frost line and the glow hug it. Under
      // the ice (the baked pass asks for a blur) they're softened with a dozen samples spread
      // over a small disc at full detail: a coarse mipmap level would turn the art blocky. The
      // thin-lined crawler (flag 2) is softened least.
      vec2 uv = d / (2. * r.zw) + .5;
      vec2 m = smoothstep(0., .03, uv) * smoothstep(1., .97, uv);
      float inside = m.x * m.y;
      edge = 1.;
      alpha = 0.;
      if (inside > 0.) {
        vec4 t;
        if (bias > 1.) {
          float rb = uMeta[i].w > 1.5 ? .006 : .012;   // blur radius, as a fraction of its height
          t = vec4(0.);
          for (int k = 0; k < 12; k++) {
            float a = float(k) * 2.39996, rr = rb * sqrt((float(k) + .5) / 12.);
            t += sampleSprite(i, clamp(uv + vec2(cos(a) * r.w / r.z, sin(a)) * rr, 0., 1.), 0.);
          }
          t /= 12.;
        } else t = sampleSprite(i, clamp(uv, 0., 1.), bias);
        if (inside > .5) edge = (.5 - t.a) * .08;
        col = t.rgb;
        alpha = t.a * inside;
      }
    } else if (shape > 2.5) {
      // The basketball: an orange sphere with its seams, lit from the top left.
      float R = r.z, l = length(d) / R;
      edge = length(d) - R;
      float lit = sqrt(max(0., 1. - l * l));
      vec2 s = d / R;
      float seams = min(min(abs(s.x), abs(s.y)), abs(length(s - vec2(1.25, 0.)) - .9));
      seams = min(seams, abs(length(s + vec2(1.25, 0.)) - .9));
      col = vec3(.9, .42, .16) * (.35 + .75 * lit * (.7 + .3 * dot(normalize(vec3(s, lit + .01)), normalize(vec3(-.5, .5, .8)))));
      col = mix(vec3(.12, .05, .02), col, smoothstep(.015, .05, seams));
    } else {
      vec2 b = r.zw;
      bool round = shape > .5 && shape < 1.5;
      float rad = round ? b.x : shape > 1.5 ? .012 : b.x * .2;
      edge = round ? length(d) - b.x : sdBox(d, b, rad);
      // No screen texture fetch outside this device.
      if (edge <= aa) {
      float bezel = .007;
      float inner = round ? length(d) - (b.x - bezel) : sdBox(d, b - bezel, max(rad - bezel, .002));
      vec2 uv = d / (2. * (b - bezel)) + .5;
      col = mix(sampleCard(i, clamp(uv, 0., 1.), bias), vec3(.06, .065, .08), smoothstep(-aa, aa, inner));
      }
    }
    return vec4(col, alpha >= 0. ? alpha : 1. - smoothstep(-aa, aa, edge));
  }
`;

const VERT = 'void main() { gl_Position = vec4(position.xy, 0., 1.); }';
const passMaterial = (fragmentShader, extra = {}) =>
  new THREE.ShaderMaterial({ uniforms: { ...u, ...extra }, vertexShader: VERT, fragmentShader, depthTest: false, depthWrite: false });

// ---------- Pass: the ice, drawn once ----------
// Target A holds static edge grain, refreeze needles, shore snow, and optical depth;
// target B holds the projects as seen blurred through the ice, and the shore. Colours are
// applied per frame (they change with the sunrise).
const ICE_DATA = /* glsl */ `${COMMON}
  void main() {
    vec2 p = screenP();
    // Clear, smooth ice: a little snow where it meets the shore, and a gentle variation in depth
    // across the lake so it doesn't read as flat paint.
    float shoreSnow = smoothstep(.07, 0., -lakeDist(p)) * smoothstep(.4, .6, fbm5(p * 9.));
    float snow = shoreSnow * (.65 + .35 * vnoise(p * 420.));
    float depth = fbm5(p * 1.2 + 20.);
    float grain = .5 + ((vnoise(p * 140.) - .5) * .03 + (vnoise(p * 40.) - .5) * .04) / .07;
    vec2 s = vec2(28., 110.);
    float needles = smoothstep(.56, .74, max(fbm3(p * s), max(fbm3(rot(2.094) * p * s + 3.), fbm3(rot(4.189) * p * s + 7.))));
    gl_FragColor = vec4(grain, needles, snow, depth);
  }`;

const ICE_UNDER = /* glsl */ `${COMMON}
  void main() {
    vec2 p = screenP();
    // The projects seen through the ice: blurred, dimmed, nudged as if by refraction, with a
    // faint frosty outline so even dark screens show where they lie.
    vec3 under = vec3(0.);
    float a = 0.;
    for (int i = 0; i < 7; i++) {
      float e;
      vec4 c = card(i, p + vec2(.005, -.007), 4.5, e);
      under = mix(under, c.rgb, c.a);
      a = max(a, c.a);
      under += vec3(.5, .66, .82) * exp(-abs(e) * 260.) * .3;
      a = max(a, exp(-abs(e) * 260.) * .5);
    }
    // Alpha: the shore. 0.5 is the waterline.
    float shore = clamp(.5 + lakeDist(p) * 25., 0., 1.);
    gl_FragColor = vec4(under * a, shore);
  }`;

// ---------- Pass: melt ----------
const MELT = /* glsl */ `
  uniform sampler2D uPrev;
  uniform vec2 uSimRes;
  uniform vec2 uView;
  uniform vec4 uSeg[3];   // a.xy, b.xy in CSS pixels: a brush stroke since the last frame
  uniform vec3 uSegR[3];  // radius (px), strength, on
  uniform float uDt;
  uniform float uRefreeze;
  // R: warmth. Each stroke leaves a cone of it (highest along the stroke, falling off evenly to
  // its edge), and all of it cools at the same rate, so the ice edge (warmth 0.5) creeps back
  // in at a steady speed and stays crisp until the hole closes to a point.
  // G: recently melted. 1 while melted, then fading over about two seconds once frozen again,
  // so new ice can show fresh frost.
  void main() {
    vec2 uv = gl_FragCoord.xy / uSimRes;
    vec4 prev = texture2D(uPrev, uv);
    float v = max(prev.r - uDt * uRefreeze, 0.);
    vec2 p = vec2(uv.x * uView.x, (1. - uv.y) * uView.y);
    for (int i = 0; i < 3; i++) {
      if (uSegR[i].z < .5) continue;
      vec2 a = uSeg[i].xy, b = uSeg[i].zw, ab = b - a;
      float h = clamp(dot(p - a, ab) / max(dot(ab, ab), 1e-4), 0., 1.);
      float d = length(p - a - ab * h) / uSegR[i].x;
      v = max(v, uSegR[i].y * max(0., 1. - d));
    }
    float recent = max(prev.g - uDt * .45, step(.5, v));
    gl_FragColor = vec4(v, recent, 0., 1.);
  }`;

// ---------- Pass: the aurora overhead, mirrored ----------
const AURORA_TOP = /* glsl */ `${COMMON}
  // Ribbons with a sharp bright hem on one side and a long soft fade on the other, rays
  // across them, surges travelling along them; the cursor draws the nearest one toward it.
  void main() {
    vec2 q = screenP();
    float t = uTime;
    vec3 col = vec3(0.);
    for (int k = 0; k < 3; k++) {
      float fk = float(k);
      float path = .22 * sin(q.x * 1.6 + t * .08 + fk * 2.1) + .1 * sin(q.x * 3.7 - t * .12 + fk)
                 + (fbm3(vec2(q.x * .8 + t * .02, fk * 5.)) - .5) * .5 + (fk - 1.) * .36
                 + .025 * sin(q.x * 9. - t * .6 + fk * 4.);
      float w = uCursor.z * exp(-pow(q.x - uCursor.x, 2.) * 6.);
      path = mix(path, uCursor.y, w * .3);
      float d = q.y - path;
      float side = d > 0. ? exp(-d * 4.) : exp(d * 30.);
      float n = .55 * vnoise(vec2(q.x * 14. + t * .3, fk)) + .45 * vnoise(vec2(q.x * 42. - t * .9, fk + 3.));
      float rays = .2 + 1.5 * n * n;
      float surge = 1. + .8 * pow(.5 + .5 * sin(q.x * 2. - t * .7 + fk * 1.7), 8.);
      float ring = abs(q.x - uPulse.x) - uPulse.z * 1.2;
      float pulse = uPulse.w * exp(-ring * ring * 20.) * exp(-uPulse.z * 1.1);
      col += auroraColor(clamp(d * 2.2, 0., 1.), q.x * 6., t) * side * rays * surge * (k == 1 ? 1. : .55) * (1. + 2. * pulse + .6 * w);
    }
    gl_FragColor = vec4(col * .75 * (1. + uFlare) * (1. - smoothstep(0., .55, uDawn)), 1.);
  }`;

// ---------- Pass: what you see ----------
const COMPOSITE = /* glsl */ `${COMMON}
  uniform sampler2D uIce, uUnder, uAur, uMelt;
  uniform vec4 uRipple[6];  // xy, age, strength
  uniform vec3 uFire;       // the cursor's flame: xy (screen units), z: brightness
  uniform vec4 uWave;       // a double-click melt wave: centre xy, edge radius, glow
  uniform sampler2D uText;  // the name, drawn where the page lays it out (page, not screen, coordinates)
  uniform sampler2D uBody;  // the body text's shape (eyebrow, intro), same coordinates
  uniform vec4 uPane[2];    // the body text's blocks, in those coordinates: x0, y0, x1, y1
  uniform vec4 uNameBounds;
  uniform float uBodyStyle; // frost behind the body text: 0 none, 1 rime, 2 frosted glass
  uniform vec2 uTextTexel;  // one pixel of that texture
  uniform float uScroll;    // how far the page has scrolled, in screen heights
  uniform float uNarrow;    // 1 on phone layouts
  uniform float uCopyShade; // 1 at home; fades to 0 while the view is up on a shore (b-rooms.js)
  bool inTextBounds(vec2 uv, vec4 r, vec2 pad) {
    return r.z > r.x && all(greaterThanEqual(uv, r.xy - pad)) && all(lessThanEqual(uv, r.zw + pad));
  }
  void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    vec2 p = screenP();
    float k1 = smoothstep(0., .55, uDawn), k2 = smoothstep(.45, 1., uDawn);
    // The flame: its heat makes what's under the surface shimmer, and its light falls warm
    // on the ice and the water around it.
    float fd = length(p - uFire.xy);
    float heat = uFire.z * exp(-fd * fd * 180.);
    vec2 shimmer = vec2(sin(p.y * 160. + uTime * 11.), cos(p.x * 150. - uTime * 9.)) * heat;
    float fireLight = uFire.z * (exp(-fd * fd * 90.) * .75 + exp(-fd * 9.) * .16);
    vec3 fireCol = vec3(1., .55, .22);
    vec4 ice4 = texture2D(uIce, uv);       // edge grain, refreeze needles, snow, depth
    vec4 under4 = texture2D(uUnder, uv);   // blurred projects, shore

  fire.flicker = reducedMotion ? 1 : 0.9 + (0.07 + 0.08 * b) * Math.sin(t * (13.1 + 9 * b)) + 0.05 * Math.sin(t * 23.7 + 1.3) + 0.04 * Math.sin(t * 7.3 + 2.1);

  if (fire.burst) {
    fire.burst = false;
    if (!reducedMotion) {
      for (let i = 0; i < 90; i++) {
        const a = Math.random() * Math.PI * 2, s = 140 + Math.random() * 300;
        fire.embers.push({
          x: fire.x, y: fire.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
          age: 0, life: 0.6 + Math.random() * 0.7, size: 1.5 + Math.random() * 2.2, seed: Math.random() * 10,
        });
      }
    }
  }
  // Embers: a few a second at rest, many more when the flame moves or flares.
  const step = Math.min(dt, 1 / 30);
  const speed = Math.hypot(fire.x - fire.px, fire.y - fire.py) / Math.max(dt, 1e-3);
  const vx = (fire.x - fire.px) / Math.max(dt, 1e-3), vy = (fire.y - fire.py) / Math.max(dt, 1e-3);
  fire.px = fire.x; fire.py = fire.y;
  if (!reducedMotion && pointer.inside) {
    fire.spawn += step * Math.min(90, 12 + speed * 0.08) * (1 + 3 * b);
    while (fire.spawn >= 1) {
      fire.spawn -= 1;
      fire.embers.push({
        x: fire.x + (Math.random() - 0.5) * 16, y: fire.y + (Math.random() - 0.5) * 12,
        vx: (Math.random() - 0.5) * 50 - vx * 0.12, vy: -(40 + Math.random() * 70) - vy * 0.08,
        age: 0, life: 0.6 + Math.random() * 0.8, size: 1.2 + Math.random() * 1.8, seed: Math.random() * 10,
      });
    }
  }
  let live = 0;
  for (const e of fire.embers) {
    e.age += dt;
    e.x += (e.vx + Math.sin(e.age * 9 + e.seed) * 18) * step;
    e.y += e.vy * step;
    e.vx *= Math.exp(-1.83 * dt); e.vy *= Math.exp(-.907 * dt);
    if (e.age < e.life) fire.embers[live++] = e;
  }
  fire.embers.length = live;
  // Ring: over a melted project, or over a link or button in the copy.
  const over = pointer.inside ? cardAt(pointer.x, pointer.y) : null;
  fire.clickable = pointer.inside && (pointer.overLink || !!(over && over.heat > 0.5));
  fire.floating = pointer.type === 'mouse' && !!over && canFloat(over);
}
function drawFire(dt, t) {
  const octx = fireCtx;
  octx.clearRect(0, 0, W, H);
  octx.globalCompositeOperation = 'lighter';
  // Embers, yellow cooling to orange and red as they rise.
  fire.embers.forEach((e) => {
    const k = e.age / e.life;
    const r = Math.round(255 - 35 * k), g = Math.round(225 - 165 * k), b = Math.round(140 - 110 * k);
    octx.globalAlpha = (1 - k) * 0.9;
    octx.fillStyle = `rgb(${r},${g},${b})`;
    octx.beginPath(); octx.arc(e.x, e.y, e.size * (1 - k * 0.4), 0, Math.PI * 2); octx.fill();
  });
  octx.globalAlpha = 1;
  const L = fire.level;
  if (L > 0.01) {
    // While flaring the flame is up to ~1.9× its size, brighter, with a wide outer bloom.
    const b = 1 - Math.pow(1 - fire.boost, 2);
    const f = fire.flicker * (1 + 0.9 * b), x = fire.x, y = fire.y;
    const A = Math.min(1, L * (1 + 0.5 * b));
    if (b > 0.01) glowDot(x, y, 210 * f, 'halo', .65 * b * L);
    // Wide warm halo.
    glowDot(x, y, 100 * f, 'halo', .85 * A);
    // Tongues of flame licking upward, each a soft stretched glow that sways (more of them, and
    // wilder, while flaring).
    const tongues = 4 + Math.round(3 * b);
    for (let k = 0; k < tongues; k++) {
      const spread = (k - (tongues - 1) / 2) * (0.32 + 0.1 * b);
      const a = -Math.PI / 2 + spread + (reducedMotion ? 0 : Math.sin(t * (3.1 + 4 * b) + k * 1.7) * (0.35 + 0.25 * b));
      const len = (26 + (reducedMotion ? 6 : 12 * Math.sin(t * (7.3 + 6 * b) + k * 2.3) + 6)) * f;
      octx.save();
      octx.translate(x + Math.cos(a) * len * 0.55, y + Math.sin(a) * len * 0.55);
      octx.rotate(a);
      octx.scale(1, 0.42);
      glowDot(0, 0, len, 'tongue', A);
      octx.restore();
    }
    // Hot glow and white-hot core.
    // A narrow, gently leaning wick of light gives the soft tongues a readable flame shape.
    const sway = reducedMotion ? 1 : Math.sin(t * 6.7) * 3 + Math.sin(t * 11.3) * 1.5;
    octx.save(); octx.translate(x, y); octx.scale(f, f);
    octx.globalAlpha = .65 * A; octx.fillStyle = '#FFB25A';
    octx.beginPath(); octx.moveTo(0, 4);
    octx.bezierCurveTo(-10, -1, -7, -14, sway, -32);
    octx.bezierCurveTo(sway - 2, -16, 12, -7, 0, 4); octx.fill();
    octx.restore();
    glowDot(x, y, 28 * f, 'hot', .75 * A);
    glowDot(x, y, 9 * (1 + 0.5 * b), 'core', A);
  }
  octx.globalCompositeOperation = 'source-over';
  if (fire.clickable && L > 0.5) {
    octx.globalAlpha = 0.9 * L;
    octx.strokeStyle = fire.floating ? '#FFD2A0' : '#FFF4E6';
    octx.lineWidth = 2;
    octx.beginPath(); octx.arc(fire.x, fire.y, 26, 0, Math.PI * 2); octx.stroke();
    octx.globalAlpha = 1;
  }
}

// ---------- Frame ----------
let running = false, raf = 0, lastFrameTime = 0, sceneTime = 20;
let qualityTime = 0, frames = 0, slow = 0;
let pendingScale = null;
let shownCard = null, shownX = 0, shownY = 0;
// Quality is an output-only change. Never clear heat or redraw the text/ice here.
// (Never below one pixel per CSS pixel, where the whole lake would turn visibly pixelated.)
const qualityFloor = Math.min(1, devicePixelRatio);
function setQuality(next) {
  pendingScale = Math.max(qualityFloor, Math.min(detailScale, next));
}
function frame(timestamp = now()) {
  // Changing a canvas size clears it, so resize before drawing, never after presentation.
  if (pendingScale !== null) {
    scale = pendingScale; pendingScale = null;
    renderer.setPixelRatio(scale);
  }
  const elapsed = lastFrameTime ? Math.max(0, (timestamp - lastFrameTime) / 1000) : 1 / 60;
  lastFrameTime = timestamp;
  // Cooling and wave progress follow elapsed time; only particle integration is capped.
  const dt = reducedMotion ? 1 / 60 : elapsed;
  // A gentle mouse follow; the flame and its melt brush share the same eased position.
  // Touch and reduced motion remain immediate, and native clicks keep their coordinates.
  if (pointer.inside && pointer.type === 'mouse' && !reducedMotion) {
    pointer.x = damp(pointer.x, pointer.targetX, 16, dt);
    pointer.y = damp(pointer.y, pointer.targetY, 16, dt);
  }
  sceneTime += dt;
  const t = reducedMotion ? 12 : sceneTime;
  ctrl.update(dt, t);
  if (needsBake) bake();

  // 1. Melt: this frame's strokes (the cursor's path, a tap, a double-click wave) melt at once.
  const seg = meltU.uSeg.value, segR = meltU.uSegR.value;
  segR.forEach((s) => s.set(0, 0, 0));
  if (pointer.inside) {
    seg[0].set(pointer.fx, pointer.fy, pointer.x, pointer.y);
    segR[0].set(brushR(), 1.4, 1);
    pointer.fx = pointer.x; pointer.fy = pointer.y;
  }
  if (splash) { seg[1].set(splash.x, splash.y, splash.x, splash.y); segR[1].set(splash.r, 1.6, 1); splash = null; }
  else if (focused || pinned) {
    const c = focused || pinned;
    seg[1].set(c.x, c.y, c.x, c.y); segR[1].set(c.reach * 1.25, 1.6, 1);
  }
  compositeMat.uniforms.uWave.value.w = 0;
  if (wave) {
    // The melt spreads out fast, then slows as it reaches the far ice; strong enough that the
    // open water lasts about ten seconds before freezing back in from the edges.
    wave.age = Math.min(WAVE_TIME, wave.age + dt);
    const k = 1 - Math.pow(1 - wave.age / WAVE_TIME, 3);
    const r = Math.max(1, wave.r * k);
    seg[2].set(wave.x, wave.y, wave.x, wave.y);
    segR[2].set(r, 2.2, 1);
    // A ring of heat glows along the advancing edge (where the warmth crosses 0.5, at
    // (1 − 0.5 / 2.2) of the radius), fading as the wave slows.
    const [wx, wy] = toP(wave.x, wave.y);
    compositeMat.uniforms.uWave.value.set(wx, wy, (r * (1 - 0.5 / 2.2)) / H, Math.pow(1 - wave.age / WAVE_TIME, 0.6));
    // Everything the wave passes melts through, and stays open (and clickable) for as long as
    // the water over it does: the warmth there starts at 2.2 × (1 − distance / radius) and
    // cools at meltU.uRefreeze per second down to the 0.5 threshold.
    CARDS.forEach((c) => {
      const d = Math.hypot(c.x - wave.x, c.y - wave.y);
      if (d >= r * 0.8) return;
      const v0 = 2.2 * Math.max(0, 1 - d / wave.r);
      c.heat = 1;
      c.openUntil = Math.max(c.openUntil || 0, now() + (Math.max(0, v0 - 0.5) / meltU.uRefreeze.value) * 850);
    });
    if (wave.age >= WAVE_TIME) wave = null;
  }
  meltU.uDt.value = reducedMotion ? 0.02 : dt;
  meltU.uPrev.value = meltTargets[meltRead].texture;
  draw(meltMat, meltTargets[1 - meltRead], meltU.uSimRes.value.x, meltU.uSimRes.value.y);
  meltRead = 1 - meltRead;
  compositeMat.uniforms.uMelt.value = meltTargets[meltRead].texture;
  updateFloating(dt);

  // The cursor's warmth over a project melts it through; away from it, it slowly frosts over.
  CARDS.forEach((c, i) => {
    const near = pointer.inside && Math.hypot(pointer.x - c.x, pointer.y - c.y) < c.reach + brushR() * 0.4;
    const hold = c === pinned || c === focused || now() < (c.openUntil || 0);
    c.heat = Math.min(1, Math.max(0, c.heat + (near || hold ? dt * 2.6 : -dt * 0.22)));
    c.hot = c.heat > 0.5;
    u.uMeta.value[i].z = c.heat;
  });
  compositeMat.uniforms.uRipple.value.forEach((r) => { r.z += dt; });
  updateFire(dt, t);
  const [fx, fy] = toP(fire.x, fire.y);
  compositeMat.uniforms.uFire.value.set(fx, fy, fire.level * fire.flicker * (1 + 1.5 * fire.boost));
  compositeMat.uniforms.uScroll.value = scrollY / H;
  compositeMat.uniforms.uNarrow.value = narrow ? 1 : 0;
  const cs = compositeMat.uniforms.uCopyShade;
  cs.value += ((roomOpen ? 0 : 1) - cs.value) * (1 - Math.exp(-dt * 4));

  // 2. The aurora overhead, at half size.
  draw(aurMat, aurTarget, aurTarget.width, aurTarget.height);
  // 3. The lake.
  const pr = renderer.getPixelRatio();
  draw(compositeMat, null, W * pr, H * pr);

  // Label the warmest melted project (on phones, below it, clear of the copy and buttons).
  const hovered = pointer.inside ? cardAt(pointer.x, pointer.y) : null;
  let show = hovered?.hot ? hovered : null;
  if (!show) for (const c of CARDS) if (c.hot && (!show || c.heat > show.heat)) show = c;
  if (show && u.uDawn.value < 0.4) {
    const y = narrow ? show.y + show.reach + 64 : show.y - show.reach - 28;
    if (show !== shownCard || show.x !== shownX || y !== shownY) tag.show(show, show.x, y);
    shownCard = show; shownX = show.x; shownY = y;
  } else if (shownCard) { tag.hide(); shownCard = null; }
  drawOverlay(dt, t);
  refreshWaterMap();

  if (running && !reducedMotion) {
    frames++; slow += elapsed > .020 ? 1 : 0; qualityTime += elapsed;
    if (qualityTime >= 2 && frames >= 45) {
      // Small, infrequent steps only for sustained missed 60 Hz frames, not one long task.
      if (slow / frames > .3 && scale > qualityFloor) setQuality(scale - .125);
      qualityTime = 0; frames = 0; slow = 0;
    }
  }
}
function start() {
  if (running) return;
  cancelAnimationFrame(raf); raf = 0; lastFrameTime = 0;
  qualityTime = 0; frames = 0; slow = 0;
  running = true;
  renderer.setAnimationLoop((time) => frame(time));
}
function stop() { cancelPointer(); running = false; renderer.setAnimationLoop(null); lastFrameTime = 0; }
function invalidate() {
  if (running || raf || document.hidden) return;
  raf = requestAnimationFrame((time) => { raf = 0; if (!running) frame(time); });
}

addEventListener('resize', () => { layout(); invalidate(); });
layout();
const heroVisible = () => scrollY < innerHeight * 1.05;
// No morning here: the page doesn't scroll, so the lake keeps its night colours (uDawn stays 0),
// and the shade behind the copy stays on.
document.documentElement.style.setProperty('--night', '1');
addEventListener('scroll', () => {
  if (reducedMotion) return;
  if (heroVisible() && !document.hidden) start(); else stop();
}, { passive: true });
document.addEventListener('visibilitychange', () => (document.hidden ? stop() : !reducedMotion && heroVisible() && !roomOpen && start()));
// The rooms pan the view off the lake onto its shores (About north, the projects east, the
// playground south). The shade
// behind the copy fades as it goes, and the lake rests while a room is open (only an edge of it
// shows, as the dock).
mountLakeRooms(hero, {
  leaving(instant) { roomOpen = true; leaveHero(); if (instant) compositeMat.uniforms.uCopyShade.value = 0; invalidate(); },
  arrived() { stop(); invalidate(); },
  returning(instant) {
    roomOpen = false;
    if (instant) compositeMat.uniforms.uCopyShade.value = 1;
    if (!reducedMotion && heroVisible()) start(); else invalidate();
  },
});
if (reducedMotion) { frame(); setTimeout(invalidate, 800); } else start();
</script>
</body>
</html>
